name: manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to cut, for example v0.2
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean
      draft:
        description: Publish as a draft instead of a release
        required: false
        default: false
        type: boolean

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a version that already exists
        run: |
          if git rev-parse --verify --quiet "refs/tags/${{ inputs.version }}" >/dev/null; then
            echo "tag ${{ inputs.version }} is already in the tree" >&2
            exit 1
          fi

      - name: Install toolchain, GRUB and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm xorriso grub-pc-bin grub-common qemu-system-x86

      - name: Build
        run: make

      - name: Boot before publishing
        run: ./scripts/boot-test.sh

      - name: Check the framework tables
        run: ./scripts/kernel-size.sh

      - name: Build the ISO
        run: |
          mkdir -p build/iso/boot/grub
          cp build/eris.elf build/iso/boot/eris.elf
          cp boot/grub.cfg build/iso/boot/grub/grub.cfg
          grub-mkrescue -o "build/eris-${{ inputs.version }}.iso" build/iso

      - name: Collect checksums
        run: |
          cd build
          sha256sum eris.elf eris32.elf "eris-${{ inputs.version }}.iso" > SHA256SUMS

      - name: Tag the commit
        run: |
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: eris ${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            build/eris.elf
            build/eris32.elf
            build/eris-${{ inputs.version }}.iso
            build/SHA256SUMS
            LICENSE
            NOTICE
