name: cppcheck

on:
  pull_request:
    paths:
      - '**.cpp'
      - '**.hpp'
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Analyse the tree
        run: |
          cppcheck \
            --std=c++20 \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --error-exitcode=1 \
            -Iinclude -Imodules \
            kernel modules
