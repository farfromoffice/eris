name: desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm qemu-system-x86

      - name: Build
        run: make

      - name: Bring the shell up and look at the screen
        run: ./scripts/desktop-test.sh

      - name: Upload the log and the screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shell
          path: |
            build/desktop.log
            build/desktop.ppm
          retention-days: 7
