name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm binutils

      - name: Build
        run: make

      - name: Verify the framework tables survived the link
        run: ./scripts/kernel-size.sh

      - name: Upload kernel
        uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: |
            build/eris.elf
            build/eris32.elf
          retention-days: 14
