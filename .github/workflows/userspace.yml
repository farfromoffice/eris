name: userspace

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ring3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain, QEMU and the ext2 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm qemu-system-x86 e2fsprogs

      - name: Build the kernel, the modules and the programs
        run: make

      - name: The initrd has to carry the programs
        run: tar -tf build/initrd.tar | grep bin/init

      - name: Run a program in ring 3 and kill one that faults
        run: ./scripts/user-test.sh

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: user-log
          path: build/user.log
          retention-days: 7
