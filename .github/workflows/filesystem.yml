name: file system

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mounts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain, QEMU and the ext2 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm qemu-system-x86 e2fsprogs

      - name: Build
        run: make

      - name: Mount ramfs, devfs and a real ext2 image
        run: ./scripts/fs-test.sh

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-log
          path: build/fs.log
          retention-days: 7
