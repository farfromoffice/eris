name: threads

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cpus: [1, 2, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm qemu-system-x86

      - name: Build
        run: make

      - name: Run the scheduler tests on ${{ matrix.cpus }} cores
        run: CPUS=${{ matrix.cpus }} ./scripts/thread-test.sh

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thread-log-${{ matrix.cpus }}
          path: build/thread.log
          retention-days: 7
