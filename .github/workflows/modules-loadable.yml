name: loadable modules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  loader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm qemu-system-x86

      - name: Build the kernel and the initrd
        run: make

      - name: The initrd has to carry the loadable modules
        run: tar -tf build/initrd.tar

      - name: Load, unload and reload an out of tree module
        run: ./scripts/module-test.sh

      - name: Boot with the loader turned off
        run: |
          timeout 40 qemu-system-x86_64 -kernel build/eris32.elf -initrd build/initrd.tar \
            -serial file:build/noload.log -display none -no-reboot -m 512M \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -append "modules.noload test_exit" >/dev/null 2>&1 || true
          grep -q "2 builtin modules registered" build/noload.log
          if grep -q "module desktop 0.1 loaded" build/noload.log; then
            echo "modules.noload did not stop the loader" >&2
            exit 1
          fi

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-logs
          path: |
            build/module.log
            build/noload.log
          retention-days: 7
